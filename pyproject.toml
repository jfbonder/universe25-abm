[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "u25"
version = "2.0.0"
description = "Minimal agent-based model of J. B. Calhoun's Universe 25 experiment (1973)"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Julián Fernández Bonder", email = "jfbonder@dm.uba.ar" }]
# Versiones exactas con las que se generaron los resultados: requirements.txt (Python 3.11.15, Linux x86-64).
# numba es opcional en principio (hay un fallback en Python puro), pero sin numba el modelo es ~100 veces más lento.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "pandas>=2.2",
    "numba>=0.60",
    "pyarrow>=15",
]

[project.optional-dependencies]
analysis = ["SALib>=1.4", "matplotlib>=3.8"]   # pipeline estadístico (Morris/Sobol) y figuras
test = ["pytest>=8"]
# make paper requiere además pdflatex y bibtex (TeX Live; no se instalan con pip)

[project.urls]
Repository = "https://github.com/jfbonder/universe25-abm"

[project.scripts]
u25 = "u25.__main__:main"

[tool.setuptools]
packages = ["u25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
